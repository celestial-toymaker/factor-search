[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-workbench"
version = "0.1.0"
description = "可解释的 A 股全市场日频回测工作台"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<2", "pandas>=2.2,<3", "pyarrow>=18,<20",
  "torch>=2.5,<2.6", "fastapi>=0.111,<0.116", "uvicorn>=0.30,<0.35",
  "matplotlib>=3.9,<4", "jinja2>=3.1,<4", "pydantic>=2.9,<3", "baostock==0.9.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<0.29"]

[project.scripts]
ashare-bt = "ashare_bt.cli:main"

[project.entry-points."ashare_bt.strategies"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["gpu: requires an MPS or CUDA device", "integration: uses full local data"]

